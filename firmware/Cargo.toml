[package]
name = "esp-unlock"
version = "0.1.0"
edition = "2024"
description = "ESP32 firmware for esp-unlock: a physical-presence USB unlock key"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { version = "1.0.0", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
esp-unlock-protocol = { path = "../protocol" }

[profile.release]
opt-level = "s"
lto = "fat"
